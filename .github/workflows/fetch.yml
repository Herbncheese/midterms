name: fetch-markets
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/markets.json; git commit -m "data" || exit 0; git push
